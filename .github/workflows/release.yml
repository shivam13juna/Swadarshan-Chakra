name: Release

# Every push to main that changes the app builds it and publishes it to GitHub Releases as
# v<version>, using CFBundleShortVersionString from packaging/Info.plist:
#   - a new version gets a new release;
#   - an existing version's release gets the new build, and its tag moves to this commit.
# Raise the version in packaging/Info.plist when a change should be a new release.
on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/MeditationCoreTests/**"
      - "Package.swift"
      - "packaging/**"
      - "scripts/**"
      - "5_pictures/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out the source
        uses: actions/checkout@v5

      - name: Show the toolchain
        run: |
          sw_vers
          swift --version

      - name: Read the app version
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' packaging/Info.plist)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - name: Verify artwork, run the core checks, and compile
        run: ./scripts/check.sh

      - name: Build and sign the release app
        run: ./scripts/build-app.sh

      - name: Verify the packaged app decodes its pictures
        run: '"dist/Swadarshan Chakra.app/Contents/MacOS/SwadarshanChakra" --verify-resources'

      - name: Package the app
        run: |
          archive="Swadarshan-Chakra-$VERSION-macOS-$(uname -m).zip"
          # ditto keeps the bundle structure and code signature intact.
          ditto -c -k --sequesterRsrc --keepParent "dist/Swadarshan Chakra.app" "$archive"
          shasum -a 256 "$archive" > "$archive.sha256"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Same version: replace the build and point the tag at the commit it was built from.
            gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
            git tag -f "$TAG" "$GITHUB_SHA"
            git push -f origin "refs/tags/$TAG"
            echo "Updated $TAG with the build of ${GITHUB_SHA::7}." >> "$GITHUB_STEP_SUMMARY"
          else
            notes="$(cat <<'NOTES'
          Swadarshan Chakra for Apple Silicon Macs running macOS 13 or newer. You can also practice in your browser at https://swadarshan-chakra.web.app.

          **Install:** download the zip, open it, and move **Swadarshan Chakra.app** to Applications. This build is signed locally (ad hoc) rather than notarized by Apple, so the first time you open it macOS asks for confirmation: open **System Settings → Privacy & Security** and choose **Open Anyway**.
          NOTES
            )"
            gh release create "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --target "$GITHUB_SHA" \
              --title "Swadarshan Chakra $VERSION" --notes "$notes" --generate-notes
            echo "Published $TAG from ${GITHUB_SHA::7}." >> "$GITHUB_STEP_SUMMARY"
          fi
